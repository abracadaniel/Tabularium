name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  integration:
    name: Database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tabularium
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["8123:8123"]
        options: --health-cmd "clickhouse-client --query 'SELECT 1'" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TABULARIUM_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TABULARIUM_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/tabularium
      TABULARIUM_TEST_CLICKHOUSE_URL: clickhouse://default@127.0.0.1:8123/default
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Driver integration tests
        run: cargo test -p tabularium-drivers -p tabularium-cli --locked

  duckdb:
    name: DuckDB (opt-in feature)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The bundled DuckDB engine (with json and parquet) is large: without debug info and
    # with fewer parallel C++ compiles the build fits the runner's disk and memory.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      NUM_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: DuckDB driver tests
        run: cargo test -p tabularium-drivers --features duckdb --test duckdb --locked
      - name: Clippy with DuckDB
        run: cargo clippy -p tabularium-drivers --features duckdb --all-targets --locked -- -D warnings

  release:
    name: Release build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo build --release --locked --target ${{ matrix.target }} -p tabularium-app -p tabularium-cli
      - uses: actions/upload-artifact@v4
        with:
          name: tabularium-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tabularium*
            !target/${{ matrix.target }}/release/*.d
