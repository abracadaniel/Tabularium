[package]
name = "tabularium-tools"
description = "Data tooling for Tabularium: DDL generation, schema diff, export/import, data change scripts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tabularium-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
csv.workspace = true
base64.workspace = true
hex.workspace = true
rust_xlsxwriter = { version = "0.92", features = ["chrono"] }
calamine = { version = "0.31", features = ["dates"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile.workspace = true
