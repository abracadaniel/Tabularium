[package]
name = "tabularium-app"
description = "Tabularium: a cross-platform database IDE"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tabularium"
path = "src/main.rs"

[dependencies]
tabularium-core.workspace = true
tabularium-drivers.workspace = true
tabularium-sql.workspace = true
tabularium-tools.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.33"
egui_extras = "0.33"
rfd = "0.15"

[features]
default = ["keychain"]
# Store saved passwords in the OS keychain instead of connections.json.
keychain = ["dep:keyring"]
# Embedded DuckDB driver (compiles the bundled DuckDB C++ engine; slow first build).
duckdb = ["tabularium-drivers/duckdb"]

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", optional = true, features = ["async-secret-service", "async-io", "crypto-rust"] }
