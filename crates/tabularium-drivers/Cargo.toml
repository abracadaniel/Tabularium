[package]
name = "tabularium-drivers"
description = "Database drivers for Tabularium (PostgreSQL, MySQL/MariaDB, SQLite, SQL Server, ClickHouse, DuckDB) plus SSH tunnelling"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["postgres", "mysql", "sqlite", "mssql", "clickhouse", "ssh"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
# `sqlx/sqlite` bundles SQLite (compiled from source via libsqlite3-sys "bundled"),
# so no system library is needed on any platform.
sqlite = ["sqlx/sqlite", "dep:libsqlite3-sys"]
mssql = ["dep:tiberius", "dep:tokio-util"]
ssh = ["dep:russh"]
# ClickHouse over HTTP(S): reqwest + rustls (ring), no OpenSSL.
clickhouse = ["dep:reqwest"]
# Embedded DuckDB. Off by default: `bundled` compiles the DuckDB C++ engine from source
# (needs only a C++ compiler, no system library), which takes several minutes.
duckdb = ["dep:duckdb"]

[dependencies]
tabularium-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
futures.workspace = true
log.workspace = true
hex.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "chrono", "uuid", "json"] }
# Same version sqlx-sqlite links against; used only for `sqlite3_interrupt` (query cancel).
libsqlite3-sys = { version = "0.30", optional = true, default-features = false }
tiberius = { version = "0.12", optional = true, default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
# `ring` crypto backend instead of the default aws-lc-rs: pure Rust + bundled C/asm that
# builds on macOS, Linux and Windows without cmake/NASM.
russh = { version = "0.54", optional = true, default-features = false, features = ["ring", "flate2", "rsa"] }
# 0.12: its `rustls-tls` feature uses the ring provider (0.13 defaults to aws-lc-rs).
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }
# `json` and `parquet` are compiled in statically: the extension autoloader would
# otherwise download them at runtime.
duckdb = { version = "1", optional = true, features = ["bundled", "json", "parquet"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
